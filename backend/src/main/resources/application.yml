server:
  port: 8082

spring:
  application:
    name: sportacus-backend

  datasource:
    # Esquema por Mundos (docs/14 §6). El esquema antiguo "sportacus" queda como respaldo.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportacus?currentSchema=sportacus_v2}
    username: ${DB_USER:sportacus_app}
    password: ${DB_PASSWORD:lyoko}
    driver-class-name: org.postgresql.Driver

  jackson:
    # Las prescripciones y widgets tienen muchos campos opcionales: no se envían los nulos.
    default-property-inclusion: non_null

  flyway:
    schemas: sportacus_v2
    default-schema: sportacus_v2
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: sportacus_v2
        format_sql: true
    show-sql: false

sportacus:
  rag:
    # Todo el motor de IA corre local vía Ollama (Docker, puerto 11434): ningún dato
    # de usuarios ni del catálogo sale de esta máquina. Sin Ollama corriendo, el chat
    # y el enriquecimiento de ejercicios se desactivan solos sin romper el resto de la app.
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${RAG_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
    chat-model: ${RAG_CHAT_MODEL:qwen2.5:7b-instruct}
    top-k: ${RAG_TOP_K:5}
  jwt:
    # JWT_SECRET: ≥ 32 bytes (texto o Base64). El valor por defecto es SOLO de desarrollo (ver JwtService.DEV_SECRET):
    # con el perfil prod la aplicación no arranca sin la variable.
    secret: ${JWT_SECRET:sportacus-dev-only-jwt-secret-cambialo-en-produccion-2026}
    expiration-minutes: 10080 # 7 días (la app guarda la sesión pendiente si expira)
  crypto:
    # Clave AES-256 (Base64 de 32 bytes) para los datos de salud. Sin ella: clave de desarrollo + aviso; en prod no arranca.
    data-key: ${SPORTACUS_DATA_KEY:}
  # Correos con acceso a GET /api/admin/analytics/summary (separados por comas). Vacío = nadie.
  admin-emails: ${SPORTACUS_ADMIN_EMAILS:}

cors:
  allowed-origins: "*"

---
# Perfil de producción: sin valores por defecto para los secretos (si faltan, la aplicación no arranca).
spring:
  config:
    activate:
      on-profile: prod
sportacus:
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    data-key: ${SPORTACUS_DATA_KEY}
